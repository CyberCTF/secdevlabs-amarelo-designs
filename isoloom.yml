# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Amarelo Designs (secDevLabs, by Globo.com) as an Isoloom spec: a Flask design studio site that
# loads its session cookie with pickle, a Software and Data Integrity Failure (insecure
# deserialization). Vendored unchanged in build/app/app/ (the app folder
# owasp-top10-2021-apps/a8/amarelo-designs of secDevLabs), built by an overlay of upstream's
# Dockerfile. Upstream also publishes port 9051 for the bind shell of its walkthrough; it is
# not declared here (nothing listens on it until the exploit, and Isoloom waits for every
# declared port), so a shell comes back as a reverse shell or from inside the lab network.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: secdevlabs-amarelo-designs

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.108.0/24, internet: false}

machines:
  app:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/app

checks:
  - name: the site answers
    http: http://app:5000/
    wait: 120
  - name: the admin session cookie is a pickle that /user loads
    script: checks/session.sh

message: |
  Amarelo Designs answers at {{ machines.app.ports.web.url }}. Log in to
  /admin, then look at the cookie you get and what /user does with it.
